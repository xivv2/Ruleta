<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ruleta Excelencia Femenina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap">

<style>
:root{
  --navy-950:#04080F;
  --navy-900:#0A192F;
  --navy-800:#102741;
  --navy-700:#183456;
  --coral:#FF7A85;
  --coral-deep:#C4404F;
  --turq:#2ED9C3;
  --turq-deep:#0E7A78;
  --cream:#FFF4EC;
  --dim:#7E9BB8;
  --gold:#FFD166;

  --notch:8px;
  --arcade:"Press Start 2P","Courier New",monospace;
  --pixel:"Pixelify Sans","Courier New",monospace;
}

*,*::before,*::after{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  background:var(--navy-950);
  color:var(--cream);
  font-family:var(--pixel);
  font-size:17px;
  line-height:1.5;
}

/* rejilla + líneas de tubo: textura, no gradiente de color */
.crt{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(4,8,15,.34) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(0deg, transparent 0 63px, rgba(46,217,195,.05) 63px 64px),
    repeating-linear-gradient(90deg, transparent 0 63px, rgba(46,217,195,.05) 63px 64px);
}

canvas{image-rendering:pixelated;image-rendering:crisp-edges;}

/* ---------- silueta de píxel (esquinas escalonadas) ---------- */
.step{
  clip-path:polygon(
    var(--notch) 0, calc(100% - var(--notch)) 0,
    calc(100% - var(--notch)) var(--notch), 100% var(--notch),
    100% calc(100% - var(--notch)), calc(100% - var(--notch)) calc(100% - var(--notch)),
    calc(100% - var(--notch)) 100%, var(--notch) 100%,
    var(--notch) calc(100% - var(--notch)), 0 calc(100% - var(--notch)),
    0 var(--notch), var(--notch) var(--notch)
  );
}

/* ---------- botones arcade ---------- */
.abtn{
  --notch:6px;
  font-family:var(--arcade);
  font-size:11px;
  line-height:1.45;
  letter-spacing:.02em;
  border:0;
  cursor:pointer;
  padding:14px 20px;
  background:var(--navy-700);
  color:var(--cream);
  filter:drop-shadow(0 5px 0 var(--navy-950));
  transition:transform .07s steps(2,end), filter .07s steps(2,end), background .1s steps(2,end);
}
.abtn:hover{transform:translateY(-3px);background:var(--turq-deep);}
.abtn:active{transform:translateY(4px);filter:drop-shadow(0 1px 0 var(--navy-950));}
.abtn:focus-visible{box-shadow:inset 0 0 0 4px var(--gold);outline:none;}
.abtn[aria-pressed="true"]{background:var(--turq-deep);color:var(--cream);}
.abtn.sm{font-size:9px;padding:11px 13px;}

.abtn.cta{
  --notch:10px;
  font-size:clamp(15px,1.7vw,22px);
  padding:26px 46px;
  background:var(--coral);
  color:var(--navy-950);
  filter:drop-shadow(0 9px 0 var(--coral-deep)) drop-shadow(0 16px 0 var(--navy-950));
}
.abtn.cta:hover{transform:translateY(-4px);background:#FF9099;}
.abtn.cta:active{transform:translateY(7px);filter:drop-shadow(0 2px 0 var(--coral-deep)) drop-shadow(0 6px 0 var(--navy-950));}
.abtn.cta:disabled{
  background:var(--navy-800);color:var(--dim);cursor:not-allowed;
  filter:drop-shadow(0 9px 0 var(--navy-950));transform:none;
}

/* ---------- estructura ---------- */
.shell{
  position:relative;
  z-index:2;
  max-width:1500px;
  margin:0 auto;
  padding:26px 30px 46px;
  display:flex;
  flex-direction:column;
  gap:26px;
}

.hud{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:22px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:18px;}

.logo-slot{
  --notch:7px;
  position:relative;
  width:74px;height:74px;
  flex:none;
  background:var(--coral);
  padding:4px;
  filter:drop-shadow(0 5px 0 var(--navy-950));
  cursor:pointer;
  border:0;
}
.logo-inner{
  width:100%;height:100%;
  background:var(--navy-900);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.logo-inner img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;}
.logo-ef{font-family:var(--arcade);font-size:19px;color:var(--coral);}
.logo-slot:hover .logo-inner{background:var(--navy-800);}
.logo-slot::after{
  content:"LOGO";
  position:absolute;left:0;right:0;bottom:-17px;
  font-family:var(--arcade);font-size:7px;color:var(--dim);text-align:center;
  opacity:0;transition:opacity .1s steps(2,end);
}
.logo-slot:hover::after,.logo-slot:focus-visible::after{opacity:1;}

.titles h1{
  margin:0;
  font-family:var(--arcade);
  font-size:clamp(19px,3vw,34px);
  line-height:1.25;
  color:var(--cream);
  text-shadow:4px 4px 0 var(--coral-deep), 8px 8px 0 var(--navy-950);
  letter-spacing:.01em;
}
.titles p{
  margin:12px 0 0;
  font-family:var(--arcade);
  font-size:9px;
  line-height:1.7;
  color:var(--turq);
  letter-spacing:.08em;
}

.hud-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.chip{
  --notch:5px;
  font-family:var(--arcade);
  font-size:9px;
  padding:12px 14px;
  background:var(--navy-900);
  color:var(--turq);
  display:flex;align-items:center;gap:9px;
  filter:drop-shadow(0 4px 0 var(--navy-950));
}
.led{width:9px;height:9px;background:var(--turq);animation:blink 1.2s steps(2,jump-none) infinite;}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:30px;align-items:start;}

/* ---------- escenario ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:30px;}
.wheel-frame{position:relative;width:100%;max-width:min(64vh,660px);aspect-ratio:1;}
.wheel-frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

.cta-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;}

.hint{
  margin:0;
  font-family:var(--arcade);
  font-size:9px;
  line-height:2;
  color:var(--dim);
  text-align:center;
}
.hint b{color:var(--gold);}

/* chispas decorativas */
.spark{position:absolute;width:4px;height:4px;background:var(--gold);pointer-events:none;
  box-shadow:8px 0 var(--gold),-8px 0 var(--gold),0 8px var(--gold),0 -8px var(--gold);
  animation:twinkle 1.6s steps(2,jump-none) infinite;}
.spark.b{background:var(--coral);box-shadow:8px 0 var(--coral),-8px 0 var(--coral),0 8px var(--coral),0 -8px var(--coral);animation-delay:.5s;}
.spark.c{background:var(--turq);box-shadow:8px 0 var(--turq),-8px 0 var(--turq),0 8px var(--turq),0 -8px var(--turq);animation-delay:1s;}
@keyframes twinkle{0%,49%{opacity:1;transform:scale(1)}50%,100%{opacity:.15;transform:scale(.5)}}

/* ---------- panel arcade ---------- */
.panel{
  --notch:9px;
  background:var(--turq-deep);
  padding:4px;
  filter:drop-shadow(0 7px 0 var(--navy-950));
}
.panel-in{
  background:var(--navy-900);
  display:flex;flex-direction:column;
  max-height:calc(100vh - 190px);
}

.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--turq-deep);padding-bottom:4px;}
.score{
  background:var(--navy-800);
  border:0;
  cursor:pointer;
  padding:15px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-family:var(--arcade);font-size:9px;color:var(--dim);
  transition:background .1s steps(2,end),color .1s steps(2,end);
}
.score:hover{background:var(--navy-700);color:var(--cream);}
.score[aria-selected="true"]{background:var(--navy-900);color:var(--cream);box-shadow:inset 0 -4px 0 var(--coral);}
.score .num{
  font-family:var(--arcade);font-size:15px;color:var(--gold);
  font-variant-numeric:tabular-nums;
}
.score[aria-selected="true"] .num{color:var(--coral);}

.pane{padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;}
.pane[hidden]{display:none;}

.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;}
.roster li{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;
  font-size:16px;
  letter-spacing:.02em;
  text-transform:uppercase;
  border-bottom:2px solid var(--navy-800);
}
.roster li:hover{background:var(--navy-800);}
.roster li:hover .tick{background:var(--coral);}
.tick{width:8px;height:8px;background:var(--turq);flex:none;}
.roster .nm{flex:1;overflow-wrap:anywhere;line-height:1.3;}
.roster .idx{font-family:var(--arcade);font-size:8px;color:var(--dim);min-width:22px;}
.kill{
  border:0;background:transparent;color:var(--dim);cursor:pointer;
  font-family:var(--arcade);font-size:9px;padding:4px 6px;
}
.kill:hover{color:var(--coral);}

textarea{
  width:100%;min-height:250px;resize:vertical;
  padding:12px;
  border:3px solid var(--turq-deep);
  background:var(--navy-950);
  color:var(--cream);
  font-family:var(--pixel);
  font-size:16px;line-height:1.7;
}
textarea:focus{border-color:var(--coral);outline:none;}

.legend{font-family:var(--arcade);font-size:8px;color:var(--dim);letter-spacing:.08em;line-height:1.9;margin:0;}
.row{display:flex;gap:9px;flex-wrap:wrap;}
.row .abtn{flex:1 1 auto;text-align:center;}

.opt{
  --notch:6px;
  display:flex;align-items:flex-start;gap:12px;
  background:var(--navy-800);
  padding:14px;
  cursor:pointer;
}
.opt input{position:absolute;opacity:0;width:0;height:0;}
.box{
  width:22px;height:22px;flex:none;margin-top:1px;
  background:var(--navy-950);
  box-shadow:inset 0 0 0 3px var(--turq);
  display:flex;align-items:center;justify-content:center;
}
.box i{width:10px;height:10px;background:var(--coral);display:none;font-style:normal;}
.opt input:checked + .box i{display:block;}
.opt input:focus-visible + .box{box-shadow:inset 0 0 0 3px var(--gold);}
.opt .txt{font-family:var(--arcade);font-size:9px;line-height:1.8;color:var(--cream);letter-spacing:.05em;}
.opt .txt small{display:block;margin-top:8px;font-family:var(--pixel);font-size:14px;letter-spacing:0;color:var(--dim);line-height:1.4;text-transform:none;}

.wins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;}
.wins li{display:flex;align-items:center;gap:11px;padding:11px 8px;border-bottom:2px solid var(--navy-800);}
.wins .pos{font-family:var(--arcade);font-size:10px;color:var(--gold);min-width:34px;}
.wins .nm{flex:1;font-size:17px;text-transform:uppercase;overflow-wrap:anywhere;line-height:1.3;}
.wins .hr{font-family:var(--arcade);font-size:8px;color:var(--dim);white-space:nowrap;}

.empty{font-family:var(--arcade);font-size:9px;line-height:2;color:var(--dim);text-align:center;padding:34px 6px;}

/* ---------- celebración ---------- */
.flash{position:fixed;inset:0;z-index:40;background:var(--cream);pointer-events:none;display:none;}
.flash.go{display:block;animation:flashout .28s steps(4,end) forwards;}
@keyframes flashout{0%{opacity:1}100%{opacity:0}}

.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(4,8,15,.94);}
.overlay[hidden]{display:none;}
#confetti{position:fixed;inset:0;z-index:22;pointer-events:none;width:100%;height:100%;}

.reveal{
  --notch:14px;
  position:relative;z-index:23;
  width:min(1180px,94vw);
  background:var(--coral);
  padding:6px;
  filter:drop-shadow(0 12px 0 var(--navy-950));
}
.reveal-in{
  background:var(--navy-900);
  padding:clamp(26px,4vw,54px) clamp(18px,4vw,56px);
  text-align:center;
  box-shadow:inset 0 0 0 4px var(--navy-950);
}
.stars{font-family:var(--arcade);font-size:clamp(16px,2.4vw,28px);color:var(--gold);letter-spacing:.4em;animation:pulse .6s steps(2,jump-none) infinite;}
@keyframes pulse{0%,49%{opacity:1}50%,100%{opacity:.35}}
.won{
  font-family:var(--arcade);
  font-size:clamp(20px,3.4vw,42px);
  color:var(--coral);
  margin:20px 0 0;
  letter-spacing:.06em;
  text-shadow:5px 5px 0 var(--navy-950);
}
.who{
  font-family:var(--arcade);
  font-size:clamp(26px,6.6vw,80px);
  line-height:1.35;
  margin:34px 0 0;
  color:var(--cream);
  text-shadow:6px 6px 0 var(--turq-deep), 12px 12px 0 var(--navy-950);
  overflow-wrap:anywhere;
  animation:pop .3s steps(3,end) both;
}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.reveal .acts{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:46px;}

/* ---------- modo proyección ---------- */
body.present .panel,
body.present .hint,
body.present .logo-slot::after{display:none;}
body.present .layout{grid-template-columns:minmax(0,1fr);}
body.present .wheel-frame{max-width:min(76vh,900px);}
body.present .titles h1{font-size:clamp(22px,2.6vw,32px);}
body.present .shell{padding-top:16px;gap:18px;}

@media (max-width:1120px){
  .layout{grid-template-columns:minmax(0,1fr);}
  .panel-in{max-height:none;}
  .wheel-frame{max-width:min(72vw,580px);}
}
@media (max-width:680px){
  .shell{padding:18px 14px 34px;}
  .wheel-frame{max-width:90vw;}
  .titles h1{text-shadow:3px 3px 0 var(--coral-deep);}
  .abtn.cta{padding:22px 28px;}
}

@media (prefers-reduced-motion:reduce){
  .led,.spark,.stars{animation:none;}
  .who{animation:none;}
  .flash.go{display:none;}
  .abtn,.abtn.cta{transition:none;}
}
</style>

</head>
<body>
<div class="crt" aria-hidden="true"></div>

<div class="shell">
  <header class="hud">
    <div class="brand">
      <button class="logo-slot step" id="logoBtn" title="Cargar el logo de LEAD (PNG o SVG)">
        <span class="logo-inner" id="logoInner"><span class="logo-ef">EF</span></span>
      </button>
      <div class="titles">
        <h1>RULETA DE SORTEOS</h1>
        <p id="brandLine">LEAD AT ULIMA · PILAR EXCELENCIA FEMENINA</p>
      </div>
    </div>
    <div class="hud-right">
      <div class="chip"><span class="led" aria-hidden="true"></span><span id="statusLine">LISTA CARGADA</span></div>
      <button class="abtn sm" id="presentBtn" aria-pressed="false">MODO PROYECCION</button>
    </div>
  </header>

  <div class="layout">
    <section class="stage">
      <div class="wheel-frame">
        <canvas id="wheel"></canvas>
        <span class="spark" style="top:-4px;left:6%"></span>
        <span class="spark b" style="bottom:8%;right:-2px"></span>
        <span class="spark c" style="top:22%;right:2%"></span>
      </div>
      <div class="cta-row">
        <button class="abtn cta" id="spinBtn">&#9733; GIRAR LA RULETA</button>
        <button class="abtn" id="soundBtn" aria-pressed="true">SONIDO: ON</button>
      </div>
      <p class="hint">[ ESPACIO ] GIRAR &nbsp;·&nbsp; [ <b>P</b> ] PROYECCION &nbsp;·&nbsp; [ ESC ] SALIR</p>
    </section>

    <aside class="panel step">
      <div class="panel-in">
        <div class="scoreboard" role="tablist">
          <button class="score" id="tabPart" role="tab" aria-selected="true" aria-controls="paneParticipantes">
            <span>PARTICIPANTES</span><span class="num" id="countPart">0</span>
          </button>
          <button class="score" id="tabWin" role="tab" aria-selected="false" aria-controls="paneGanadoras">
            <span>GANADORAS</span><span class="num" id="countWin">0</span>
          </button>
        </div>

        <div class="pane" id="paneParticipantes" role="tabpanel" aria-labelledby="tabPart">
          <ul class="roster" id="roster"></ul>
          <p class="empty" id="rosterEmpty" hidden>SIN PARTICIPANTES<br>PULSA EDITAR LISTA</p>

          <label class="legend" for="names" id="namesLabel" hidden>UN NOMBRE POR LINEA</label>
          <textarea id="names" spellcheck="false" hidden placeholder="Ana Lucía Quispe&#10;Camila Rojas&#10;…"></textarea>

          <div class="row">
            <button class="abtn sm" id="editBtn">EDITAR LISTA</button>
            <button class="abtn sm" id="importBtn">IMPORTAR .TXT / .CSV</button>
          </div>
          <div class="row">
            <button class="abtn sm" id="clearBtn">VACIAR LISTA</button>
            <button class="abtn sm" id="restoreBtn">DEVOLVER TODAS</button>
          </div>
          <input type="file" id="fileInput" accept=".txt,.csv,text/plain,text/csv" hidden>
          <input type="file" id="logoInput" accept="image/*" hidden>

          <label class="opt step">
            <input type="checkbox" id="removeAfter" checked>
            <span class="box" aria-hidden="true"><i></i></span>
            <span class="txt">RETIRAR GANADORA
              <small>Cada nombre sale una vez. Ideal para varios premios seguidos.</small>
            </span>
          </label>
        </div>

        <div class="pane" id="paneGanadoras" role="tabpanel" aria-labelledby="tabWin" hidden>
          <ul class="wins" id="winnersList"></ul>
          <p class="empty" id="winnersEmpty">AUN NO HAY GANADORAS<br>PULSA GIRAR LA RULETA</p>
          <div class="row">
            <button class="abtn sm" id="exportBtn">DESCARGAR CSV</button>
            <button class="abtn sm" id="resetWinBtn">BORRAR HISTORIAL</button>
          </div>
          <label class="legend" for="exportBox" id="exportLabel" hidden>COPIA EL HISTORIAL</label>
          <textarea id="exportBox" hidden readonly style="min-height:130px"></textarea>
        </div>
      </div>
    </aside>
  </div>
</div>

<div class="flash" id="flash" aria-hidden="true"></div>

<div class="overlay" id="overlay" hidden>
  <canvas id="confetti"></canvas>
  <div class="reveal step">
    <div class="reveal-in">
      <p class="stars">&#9733; &#9733; &#9733;</p>
      <p class="won" id="revealKicker">&iexcl;GANADORA!</p>
      <p class="who" id="revealName">&mdash;</p>
      <div class="acts">
        <button class="abtn cta" id="againBtn">SIGUIENTE SORTEO</button>
        <button class="abtn" id="closeBtn">CERRAR</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var TAU = Math.PI * 2;
  var STORE_KEY = "ruleta-excelencia-femenina-v1";
  var SEG_FILL = ["#102741", "#2ED9C3", "#FF7A85", "#0E7A78"];
  var SEG_INK  = ["#FFF4EC", "#04080F", "#04080F", "#FFF4EC"];

  var EJEMPLO = [
    "Ana Lucía Quispe", "Camila Rojas", "Fernanda Alcántara", "Valeria Núñez",
    "Micaela Torres", "Sofía Bustamante", "Renata Chávez", "Daniela Paredes",
    "Luciana Mendoza", "Gabriela Ríos", "Andrea Salazar", "Paula Vergara"
  ];

  var state = {
    participants: EJEMPLO.slice(),
    removed: [],
    historial: [],
    removeAfter: true,
    sound: true,
    isExample: true,
    logo: null
  };

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- persistencia ---------- */
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch (e) { /* almacenamiento bloqueado: seguimos en memoria */ }
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (!d || typeof d !== "object") return;
      if (Array.isArray(d.participants)) state.participants = d.participants;
      if (Array.isArray(d.removed)) state.removed = d.removed;
      if (Array.isArray(d.historial)) state.historial = d.historial;
      if (typeof d.removeAfter === "boolean") state.removeAfter = d.removeAfter;
      if (typeof d.sound === "boolean") state.sound = d.sound;
      if (typeof d.logo === "string") state.logo = d.logo;
      state.isExample = d.isExample === true;
    } catch (e) { /* dato corrupto: arranca con el ejemplo */ }
  }

  /* ---------- DOM ---------- */
  var wheel = $("wheel"), confetti = $("confetti");
  var wctx = wheel.getContext("2d"), cctx = confetti.getContext("2d");
  var namesEl = $("names"), spinBtn = $("spinBtn");
  var overlay = $("overlay"), revealName = $("revealName"), revealKicker = $("revealKicker");
  var roster = $("roster"), rosterEmpty = $("rosterEmpty");
  var winnersList = $("winnersList"), winnersEmpty = $("winnersEmpty");
  var countPart = $("countPart"), countWin = $("countWin"), statusLine = $("statusLine");
  var soundBtn = $("soundBtn"), presentBtn = $("presentBtn"), removeAfterEl = $("removeAfter");
  var exportBox = $("exportBox"), exportLabel = $("exportLabel");
  var logoInner = $("logoInner"), flashEl = $("flash");

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var editing = false;

  /* ---------- logo ---------- */
  var logoImg = null;
  function applyLogo() {
    logoInner.innerHTML = "";
    if (state.logo) {
      var im = document.createElement("img");
      im.alt = "Logo LEAD";
      im.src = state.logo;
      logoInner.appendChild(im);
      logoImg = new Image();
      logoImg.onload = draw;
      logoImg.src = state.logo;
    } else {
      var s = document.createElement("span");
      s.className = "logo-ef";
      s.textContent = "EF";
      logoInner.appendChild(s);
      logoImg = null;
      draw();
    }
  }

  /* ---------- colores por segmento ---------- */
  function colorIndexes(n) {
    var out = [], i;
    for (i = 0; i < n; i++) out.push(i % SEG_FILL.length);
    if (n > 2 && out[n - 1] === out[0]) {
      var prev = out[n - 2];
      for (i = 0; i < SEG_FILL.length; i++) {
        if (i !== out[0] && i !== prev) { out[n - 1] = i; break; }
      }
    }
    return out;
  }

  /* ---------- ruleta ---------- */
  var rotation = 0, spinning = false, chase = 0;
  var IW = 0, R = 0, SCALE = 2;

  function resize() {
    var rect = wheel.parentElement.getBoundingClientRect();
    var css = Math.max(240, Math.floor(Math.min(rect.width, rect.height)));
    IW = Math.max(200, Math.round(css / SCALE));   // lienzo de baja resolución, escalado con pixelated
    wheel.width = IW; wheel.height = IW;
    R = IW / 2 - Math.round(IW * 0.075);
    draw();
  }

  // ajusta el cuerpo de letra por nombre para que quepa entero; sólo recorta como último recurso
  function setNameFont(size) {
    wctx.font = "600 " + size.toFixed(1) + 'px "Pixelify Sans", monospace';
  }
  function fitName(text, maxWidth, base, floor) {
    var s = base;
    setNameFont(s);
    while (s > floor && wctx.measureText(text).width > maxWidth) {
      s -= 0.5;
      setNameFont(s);
    }
    if (wctx.measureText(text).width <= maxWidth) return text;
    var t = text;
    while (t.length > 1 && wctx.measureText(t + ".").width > maxWidth) t = t.slice(0, -1);
    return t + ".";
  }

  function drawRing(cx, cy) {
    var blocks = 48;
    var rr = R + Math.round(IW * 0.026);
    var b = Math.max(4, Math.round(IW * 0.026));
    for (var i = 0; i < blocks; i++) {
      var a = (i / blocks) * TAU - Math.PI / 2;
      var x = Math.round(cx + Math.cos(a) * rr - b / 2);
      var y = Math.round(cy + Math.sin(a) * rr - b / 2);
      var lit = ((i + chase) % 3 === 0);
      wctx.fillStyle = "#04080F";
      wctx.fillRect(x - 1, y - 1, b + 2, b + 2);
      wctx.fillStyle = lit ? (spinning ? "#FFD166" : "#FF7A85") : "#FFF4EC";
      wctx.fillRect(x, y, b, b);
    }
  }

  function drawPointer(cx, cy) {
    // sprite: filas de píxeles que forman una punta hacia abajo
    var u = Math.max(2, Math.round(IW * 0.011));
    var topY = Math.round(cy - R - u * 7);
    var rows = 7;
    for (var r = 0; r < rows; r++) {
      var w = (rows - r) * 2 * u;
      var x = Math.round(cx - w / 2);
      var y = topY + r * u;
      wctx.fillStyle = "#04080F";
      wctx.fillRect(x - u, y, w + u * 2, u);
      wctx.fillStyle = (r < 2) ? "#FFF4EC" : "#FF7A85";
      wctx.fillRect(x, y, w, u);
    }
  }

  function drawHub(cx, cy) {
    var hr = Math.round(R * 0.165);
    var u = Math.max(2, Math.round(IW * 0.011));
    // marco escalonado
    wctx.fillStyle = "#FFF4EC";
    wctx.fillRect(cx - hr - u, cy - hr + u, (hr + u) * 2, (hr - u) * 2);
    wctx.fillRect(cx - hr + u, cy - hr - u, (hr - u) * 2, (hr + u) * 2);
    wctx.fillStyle = "#04080F";
    wctx.fillRect(cx - hr, cy - hr + u, hr * 2, (hr - u) * 2);
    wctx.fillRect(cx - hr + u, cy - hr, (hr - u) * 2, hr * 2);

    if (logoImg && logoImg.complete && logoImg.naturalWidth) {
      var s = hr * 1.55;
      var ar = logoImg.naturalWidth / logoImg.naturalHeight;
      var w = ar >= 1 ? s : s * ar;
      var h = ar >= 1 ? s / ar : s;
      wctx.drawImage(logoImg, Math.round(cx - w / 2), Math.round(cy - h / 2), Math.round(w), Math.round(h));
    } else {
      wctx.fillStyle = "#FF7A85";
      wctx.font = Math.round(hr * 0.78) + 'px "Press Start 2P", monospace';
      wctx.textAlign = "center";
      wctx.textBaseline = "middle";
      wctx.fillText("EF", cx, cy + 1);
    }
  }

  function draw() {
    var n = state.participants.length;
    var cx = Math.round(IW / 2), cy = Math.round(IW / 2);
    wctx.setTransform(1, 0, 0, 1, 0, 0);
    wctx.clearRect(0, 0, IW, IW);

    if (n === 0) {
      wctx.fillStyle = "#102741";
      wctx.beginPath(); wctx.arc(cx, cy, R, 0, TAU); wctx.fill();
      wctx.fillStyle = "#7E9BB8";
      wctx.font = Math.round(IW * 0.032) + 'px "Press Start 2P", monospace';
      wctx.textAlign = "center"; wctx.textBaseline = "middle";
      wctx.fillText("SIN", cx, cy - IW * 0.03);
      wctx.fillText("NOMBRES", cx, cy + IW * 0.03);
      drawRing(cx, cy); drawPointer(cx, cy);
      return;
    }

    var seg = TAU / n;
    var cidx = colorIndexes(n);
    var fs = Math.max(7, Math.min(R * 0.105, seg * R * 0.62 * 0.62));
    var floorFs = Math.max(6, fs * 0.58);
    var pad = Math.round(R * 0.085);
    var maxText = R * 0.68;

    wctx.save();
    wctx.translate(cx, cy);
    wctx.rotate(rotation);

    for (var i = 0; i < n; i++) {
      var a0 = -Math.PI / 2 + i * seg;
      wctx.beginPath();
      wctx.moveTo(0, 0);
      wctx.arc(0, 0, R, a0, a0 + seg);
      wctx.closePath();
      wctx.fillStyle = SEG_FILL[cidx[i]];
      wctx.fill();
      if (n <= 48) {
        wctx.strokeStyle = "#04080F";
        wctx.lineWidth = Math.max(1, Math.round(IW * 0.005));
        wctx.stroke();
      }

      var world = ((a0 + seg / 2 + rotation) % TAU + TAU) % TAU;
      var flip = world > Math.PI / 2 && world < Math.PI * 1.5;

      wctx.save();
      wctx.rotate(a0 + seg / 2);
      if (flip) wctx.rotate(Math.PI);
      wctx.textAlign = flip ? "left" : "right";
      wctx.textBaseline = "middle";
      var label = fitName(state.participants[i].toUpperCase(), maxText, fs, floorFs);
      var tx = flip ? -(R - pad) : R - pad;
      wctx.fillStyle = "rgba(4,8,15,.45)";
      wctx.fillText(label, tx + 1, 1);
      wctx.fillStyle = SEG_INK[cidx[i]];
      wctx.fillText(label, tx, 0);
      wctx.restore();
    }
    wctx.restore();

    drawHub(cx, cy);
    drawRing(cx, cy);
    drawPointer(cx, cy);
  }

  function winnerIndex() {
    var n = state.participants.length;
    if (!n) return -1;
    var seg = TAU / n;
    var norm = ((-rotation % TAU) + TAU) % TAU;
    return Math.floor(norm / seg) % n;
  }

  /* ---------- sonido arcade ---------- */
  var audio = null;
  function beep(freq, dur, vol, type) {
    if (!state.sound) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = type || "square";
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) { /* sin audio */ }
  }
  function jingle() {
    var notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5];
    notes.forEach(function (f, i) { setTimeout(function () { beep(f, 0.18, 0.08); }, i * 95); });
  }

  /* ---------- confeti de píxeles ---------- */
  var parts = [], confRAF = null, cw = 0, ch = 0;
  function sizeConfetti() {
    cw = Math.ceil(window.innerWidth / 4);
    ch = Math.ceil(window.innerHeight / 4);
    confetti.width = cw; confetti.height = ch;
  }
  function burst() {
    if (reduceMotion) return;
    sizeConfetti();
    var colors = ["#FF7A85", "#2ED9C3", "#FFD166", "#FFF4EC"];
    parts = [];
    for (var i = 0; i < 260; i++) {
      parts.push({
        x: Math.random() * cw,
        y: -Math.random() * ch * 1.6,
        vx: (Math.random() - 0.5) * 1.1,
        vy: 0.4 + Math.random() * 1.1,
        s: 2 + ((Math.random() * 3) | 0),
        c: colors[(Math.random() * colors.length) | 0],
        f: 0
      });
    }
    if (!confRAF) confRAF = requestAnimationFrame(stepConfetti);
  }
  function stepConfetti() {
    cctx.clearRect(0, 0, cw, ch);
    var alive = 0;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.vy += 0.02;
      p.x += p.vx; p.y += p.vy;
      p.f = (p.f + 1) % 16;
      if (p.y > ch + 6) continue;
      alive++;
      if (p.f < 12) {                       // parpadeo de 2 fotogramas
        cctx.fillStyle = p.c;
        cctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
      }
    }
    if (alive > 0 && !overlay.hidden) { confRAF = requestAnimationFrame(stepConfetti); }
    else { confRAF = null; cctx.clearRect(0, 0, cw, ch); }
  }

  /* ---------- giro ---------- */
  function spin() {
    var n = state.participants.length;
    if (spinning || n === 0) return;
    if (editing) toggleEdit();
    spinning = true;
    spinBtn.disabled = true;
    overlay.hidden = true;

    var start = rotation;
    var target = rotation + (5 + Math.random() * 3) * TAU + Math.random() * TAU;
    var dur = reduceMotion ? 700 : 6400;
    var t0 = performance.now();
    var lastIdx = winnerIndex();
    beep(180, 0.12, 0.07, "sawtooth");

    function frame(now) {
      var t = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - t, 5);
      rotation = start + (target - start) * e;
      chase = Math.floor(now / 70);
      draw();
      var idx = winnerIndex();
      if (idx !== lastIdx) {
        lastIdx = idx;
        if (t < 0.97) beep(1200 - t * 420, 0.035, 0.045 * (1 - t) + 0.01);
      }
      if (t < 1) requestAnimationFrame(frame);
      else {
        rotation = ((target % TAU) + TAU) % TAU;
        spinning = false;
        chase = 0;
        draw();
        finish();
      }
    }
    requestAnimationFrame(frame);
  }

  function finish() {
    spinBtn.disabled = state.participants.length === 0;
    var idx = winnerIndex();
    if (idx < 0) return;
    var name = state.participants[idx];

    state.historial.unshift({ name: name, ts: Date.now() });
    if (state.removeAfter) {
      state.participants.splice(idx, 1);
      state.removed.push(name);
      rotation = 0;
    }
    state.isExample = false;
    save();
    render();

    revealKicker.textContent = state.historial.length === 1
      ? "¡GANADORA!"
      : "¡GANADORA #" + state.historial.length + "!";
    revealName.textContent = name.toUpperCase();
    overlay.hidden = false;

    if (!reduceMotion) {
      flashEl.classList.remove("go");
      void flashEl.offsetWidth;
      flashEl.classList.add("go");
    }
    burst();
    jingle();
    $("againBtn").focus();
  }

  /* ---------- interfaz ---------- */
  function fmtTime(ts) {
    return new Date(ts).toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" });
  }

  function tickNumber(el, to) {
    var from = parseInt(el.textContent, 10);
    if (isNaN(from) || from === to || reduceMotion) { el.textContent = to; return; }
    var steps = Math.min(8, Math.abs(to - from)), i = 0;
    var id = setInterval(function () {
      i++;
      el.textContent = Math.round(from + (to - from) * (i / steps));
      if (i >= steps) { clearInterval(id); el.textContent = to; }
    }, 45);
  }

  function render() {
    tickNumber(countPart, state.participants.length);
    tickNumber(countWin, state.historial.length);
    removeAfterEl.checked = state.removeAfter;
    soundBtn.textContent = state.sound ? "SONIDO: ON" : "SONIDO: OFF";
    soundBtn.setAttribute("aria-pressed", state.sound ? "true" : "false");
    spinBtn.disabled = state.participants.length === 0 || spinning;

    if (state.participants.length === 0) {
      statusLine.textContent = state.historial.length ? "SORTEO TERMINADO" : "SIN PARTICIPANTES";
    } else if (state.isExample) {
      statusLine.textContent = "LISTA DE EJEMPLO";
    } else {
      statusLine.textContent = state.participants.length + " EN JUEGO" +
        (state.removed.length ? " / " + state.removed.length + " FUERA" : "");
    }

    // lista de participantes
    roster.innerHTML = "";
    rosterEmpty.hidden = state.participants.length > 0 || editing;
    roster.hidden = editing;
    state.participants.forEach(function (nm, i) {
      var li = document.createElement("li");
      var idx = document.createElement("span"); idx.className = "idx"; idx.textContent = String(i + 1).padStart(2, "0");
      var tk = document.createElement("span"); tk.className = "tick";
      var t = document.createElement("span"); t.className = "nm"; t.textContent = nm;
      var k = document.createElement("button"); k.className = "kill"; k.type = "button";
      k.textContent = "X"; k.title = "Quitar a " + nm;
      k.addEventListener("click", function () {
        state.participants.splice(i, 1);
        state.isExample = false;
        rotation = 0;
        save(); render();
      });
      li.appendChild(idx); li.appendChild(tk); li.appendChild(t); li.appendChild(k);
      roster.appendChild(li);
    });

    // historial
    winnersList.innerHTML = "";
    winnersEmpty.hidden = state.historial.length > 0;
    state.historial.forEach(function (w, i) {
      var li = document.createElement("li");
      var p = document.createElement("span"); p.className = "pos"; p.textContent = "#" + (state.historial.length - i);
      var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = w.name;
      var hr = document.createElement("span"); hr.className = "hr"; hr.textContent = fmtTime(w.ts);
      li.appendChild(p); li.appendChild(nm); li.appendChild(hr);
      winnersList.appendChild(li);
    });

    draw();
  }

  function readTextarea() {
    var lines = namesEl.value.split("\n").map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });
    var seen = Object.create(null), out = [];
    lines.forEach(function (s) {
      var k = s.toLowerCase();
      if (!seen[k]) { seen[k] = 1; out.push(s); }
    });
    return out;
  }
  function syncFromTextarea() {
    state.participants = readTextarea();
    state.isExample = false;
    rotation = 0;
    save(); render();
  }
  function fillTextarea() { namesEl.value = state.participants.join("\n"); }

  function toggleEdit() {
    editing = !editing;
    if (editing) fillTextarea(); else syncFromTextarea();
    namesEl.hidden = !editing;
    $("namesLabel").hidden = !editing;
    $("editBtn").textContent = editing ? "GUARDAR LISTA" : "EDITAR LISTA";
    $("editBtn").setAttribute("aria-pressed", editing ? "true" : "false");
    render();
    if (editing) namesEl.focus();
  }

  /* ---------- eventos ---------- */
  spinBtn.addEventListener("click", spin);
  $("againBtn").addEventListener("click", function () { overlay.hidden = true; spin(); });
  $("closeBtn").addEventListener("click", function () { overlay.hidden = true; spinBtn.focus(); });
  $("editBtn").addEventListener("click", toggleEdit);

  var typeTimer = null;
  namesEl.addEventListener("input", function () {
    clearTimeout(typeTimer);
    typeTimer = setTimeout(function () {
      state.participants = readTextarea();
      state.isExample = false;
      rotation = 0;
      save();
      tickNumber(countPart, state.participants.length);
      draw();
    }, 350);
  });

  $("clearBtn").addEventListener("click", function () {
    state.participants = [];
    state.isExample = false;
    rotation = 0;
    if (editing) namesEl.value = "";
    save(); render();
  });

  $("restoreBtn").addEventListener("click", function () {
    if (!state.removed.length) return;
    state.participants = state.participants.concat(state.removed);
    state.removed = [];
    rotation = 0;
    if (editing) fillTextarea();
    save(); render();
  });

  removeAfterEl.addEventListener("change", function () {
    state.removeAfter = removeAfterEl.checked;
    save();
    beep(state.removeAfter ? 880 : 440, 0.07, 0.05);
  });

  soundBtn.addEventListener("click", function () {
    state.sound = !state.sound;
    soundBtn.textContent = state.sound ? "SONIDO: ON" : "SONIDO: OFF";
    soundBtn.setAttribute("aria-pressed", state.sound ? "true" : "false");
    save();
    if (state.sound) beep(880, 0.1, 0.06);
  });

  $("importBtn").addEventListener("click", function () { $("fileInput").click(); });
  $("fileInput").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var rows = String(reader.result || "").split(/\r?\n/).map(function (line) {
        return line.split(/[,;\t]/)[0].trim().replace(/^"|"$/g, "");
      }).filter(function (s) { return s.length > 0; });
      if (rows.length && /^(nombre|name|participante|apellidos?)$/i.test(rows[0])) rows.shift();
      var seen = Object.create(null), out = [];
      rows.forEach(function (s) { var k = s.toLowerCase(); if (!seen[k]) { seen[k] = 1; out.push(s); } });
      state.participants = out;
      state.isExample = false;
      rotation = 0;
      if (editing) fillTextarea();
      save(); render();
      beep(1046, 0.12, 0.06);
    };
    reader.readAsText(f, "utf-8");
    ev.target.value = "";
  });

  // logo: se guarda reducido en el navegador
  $("logoBtn").addEventListener("click", function () { $("logoInput").click(); });
  $("logoInput").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 256;
        var sc = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * sc));
        c.height = Math.max(1, Math.round(img.height * sc));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        try { state.logo = c.toDataURL("image/png"); } catch (e) { state.logo = String(reader.result); }
        save();
        applyLogo();
        beep(1318, 0.12, 0.06);
      };
      img.onerror = function () { state.logo = String(reader.result); save(); applyLogo(); };
      img.src = String(reader.result);
    };
    reader.readAsDataURL(f);
    ev.target.value = "";
  });

  $("resetWinBtn").addEventListener("click", function () {
    state.historial = [];
    save(); render();
  });

  $("exportBtn").addEventListener("click", async function () {
    if (!state.historial.length) return;
    var rows = ["#,Nombre,Hora"];
    state.historial.slice().reverse().forEach(function (w, i) {
      rows.push((i + 1) + ',"' + String(w.name).replace(/"/g, '""') + '",' + fmtTime(w.ts));
    });
    var csv = rows.join("\n");
    var downloads = null;
    try { downloads = await window.claude.use("downloads"); } catch (e) { downloads = null; }
    if (downloads) {
      try {
        await downloads.save({ filename: "ganadoras-excelencia-femenina.csv", data: csv });
        return;
      } catch (e) { /* rechazado: mostramos el texto para copiar */ }
    }
    exportBox.value = csv;
    exportBox.hidden = false;
    exportLabel.hidden = false;
    exportBox.focus();
    exportBox.select();
  });

  function selectTab(which) {
    var p = which === "part";
    $("tabPart").setAttribute("aria-selected", p ? "true" : "false");
    $("tabWin").setAttribute("aria-selected", p ? "false" : "true");
    $("paneParticipantes").hidden = !p;
    $("paneGanadoras").hidden = p;
    beep(p ? 660 : 784, 0.05, 0.04);
  }
  $("tabPart").addEventListener("click", function () { selectTab("part"); });
  $("tabWin").addEventListener("click", function () { selectTab("win"); });

  function togglePresent() {
    var on = document.body.classList.toggle("present");
    presentBtn.setAttribute("aria-pressed", on ? "true" : "false");
    presentBtn.textContent = on ? "SALIR" : "MODO PROYECCION";
    setTimeout(resize, 70);
  }
  presentBtn.addEventListener("click", togglePresent);

  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "TEXTAREA" || tag === "INPUT") return;
    if (e.code === "Space" || e.key === "Enter") {
      e.preventDefault();
      overlay.hidden = true;
      spin();
    } else if (e.key === "p" || e.key === "P") {
      togglePresent();
    } else if (e.key === "Escape") {
      if (!overlay.hidden) overlay.hidden = true;
      else if (document.body.classList.contains("present")) togglePresent();
    }
  });

  window.addEventListener("resize", function () { resize(); sizeConfetti(); });

  /* ---------- arranque ---------- */
  load();
  applyLogo();
  sizeConfetti();
  resize();
  render();

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { draw(); });
  }
})();
</script>

</body>
</html>
